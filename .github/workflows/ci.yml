name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Many commits land on main in quick succession: one run at a time per ref,
# and a newer push replaces the pending one instead of queueing them all.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # FFmpeg is linked dynamically. On macOS the Homebrew build is used for
      # development; releases bundle an LGPL build.
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkgconf

      # LGPL shared build: DLLs, import libraries and headers.
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          scripts/ffmpeg/fetch-windows.ps1
          # bindgen in ffmpeg-sys-next's build script can overflow the
          # default 1 MB main-thread stack on Windows.
          "RUSTFLAGS=-C link-arg=/STACK:16777216" | Out-File -FilePath $env:GITHUB_ENV -Append

      - run: cargo build --workspace --all-targets
      - name: Report hardware decode / encode support
        run: cargo run -p jb-media --example hwinfo
      - run: cargo test --workspace
      # Buffers handed to FFmpeg must be large enough for its SIMD kernels:
      # Guard Malloc with exact sizes faults on the first out-of-bounds byte
      # instead of letting heap corruption crash a later run at exit.
      - name: FFmpeg buffer bounds under Guard Malloc (macOS)
        if: runner.os == 'macOS'
        run: >
          cargo test -p jb-media --lib
          --config 'target.aarch64-apple-darwin.runner = ["env", "DYLD_INSERT_LIBRARIES=/usr/lib/libgmalloc.dylib", "MALLOC_STRICT_SIZE=1"]'
          convert
      - name: Upload golden mismatches
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actual-${{ matrix.os }}
          path: crates/jb-render/tests/golden/*.actual.png
          if-no-files-found: ignore

  app-frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  # Release-mode packages with the LGPL FFmpeg bundled (`pnpm tauri build` on
  # both platforms), smoke tested on the runner. See docs/packaging.md.
  packages:
    uses: ./.github/workflows/build.yml
    secrets: inherit
