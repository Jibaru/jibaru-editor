[package]
name = "jb-cli"
description = "The jb command-line tool"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "jb_cli"
path = "src/lib.rs"

[[bin]]
name = "jb"
path = "src/main.rs"

[dependencies]
jb-core.workspace = true
jb-filmora.workspace = true
jb-media.workspace = true
jb-render.workspace = true
jb-export.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
schemars = "1"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
