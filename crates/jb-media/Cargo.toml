[package]
name = "jb-media"
description = "Media probing and hardware-accelerated decoding on top of FFmpeg"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
jb-core.workspace = true
anyhow.workspace = true
libc = "0.2"
# Dynamically linked against the system FFmpeg (>= 8). Only LGPL components
# of FFmpeg are used.
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif", "tga", "qoi", "rayon"] }

[dev-dependencies]
serde_json.workspace = true
